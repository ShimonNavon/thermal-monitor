<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal — Mac &amp; cluster</title>
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --surface-2: #f0f0ed;
    --border: #e3e3de;
    --text: #17181a;
    --muted: #6b7078;
    --accent: #e8590c;
    --ok: #2f9e44;
    --warn: #f08c00;
    --danger: #e03131;
    --shadow: 0 1px 2px rgba(16, 18, 22, 0.04), 0 8px 24px rgba(16, 18, 22, 0.05);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e10;
      --surface: #16181b;
      --surface-2: #1d2024;
      --border: #26292e;
      --text: #f1f2f4;
      --muted: #9aa0a8;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 12px 32px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 22px 64px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.live .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
  .pill.stale .dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }
  .summary { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 20px; }
  .stat {
    display: flex; align-items: baseline; gap: 7px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: var(--muted);
  }
  .stat b { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 650; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 20px 16px; }
  .card.stale { opacity: 0.72; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card-title { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-tag {
    flex: none; font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .card.stale .card-tag { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
  .temp { display: flex; align-items: flex-start; gap: 4px; margin: 14px 0 2px; }
  .value { font-size: 50px; font-weight: 650; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; }
  .unit { font-size: 17px; font-weight: 500; color: var(--muted); margin-top: 6px; }
  .value.hot { color: var(--warn); }
  .value.critical { color: var(--danger); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .meta b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .spark { width: 100%; height: 42px; margin-top: 12px; display: block; overflow: visible; }
  .zones { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 9px; display: grid; gap: 4px; }
  .zone { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 12px; }
  .zone span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }
  section.table-card { margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .table-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .table-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .table-head .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 1; background: var(--surface); white-space: nowrap;
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); padding: 9px 16px; border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 10px 16px; border-bottom: 1px solid color-mix(in srgb, var(--border) 65%, transparent); font-size: 13px; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; }
  td.node { font-weight: 550; }
  footer { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: copy; font: inherit; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
    font-size: 12px; font-variant-numeric: tabular-nums; transition: border-color 140ms ease, background 140ms ease;
  }
  .chip:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toast {
    position: fixed; right: 20px; bottom: 20px; background: #1b1d21; color: #f4f4f5;
    padding: 9px 14px; border-radius: 9px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    opacity: 0; transform: translateY(6px); transition: opacity 160ms ease, transform 160ms ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 560px) {
    .wrap { padding: 32px 16px 48px; }
    .value { font-size: 44px; }
    thead th, tbody td { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Thermal monitor</p>
      <h1>Temperature &amp; load</h1>
      <p class="sub">MacBook Pro + Kubernetes cluster · live over Tailscale</p>
    </div>
    <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">connecting</span></span>
  </header>

  <div class="summary" id="summary"></div>
  <div class="grid" id="cards"><p class="empty">Waiting for the first readings…</p></div>

  <section class="table-card">
    <div class="table-head">
      <h2>Machines</h2>
      <span class="count" id="rowCount">0</span>
    </div>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Machine</th><th>Last seen</th><th>CPU</th><th>GPU</th>
            <th>Load 1m</th><th>Memory</th><th>Disk</th><th>Uptime</th><th>Fans</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <footer>
    <button class="chip" id="endpoint" title="Copy endpoint">http://ubuntu03:30100</button>
    <span>updates every 5s · Mac every 15s · agents every 15s</span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const STALE_MS = 75000;
let latest = null;

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtTemp(v) { return v == null ? "—" : v.toFixed(1); }
function fmtPct(v) { return v == null ? "—" : Math.round(v) + "%"; }
function fmtLoad(v) { return v == null ? "—" : v.toFixed(2); }
function fmtUptime(s) {
  if (s == null) return "—";
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return d + "d " + h + "h";
  if (h > 0) return h + "h " + m + "m";
  return m + "m";
}
function heatClass(v) { return v == null ? "" : v >= 85 ? "critical" : v >= 72 ? "hot" : ""; }

function ago(ms) {
  if (!ms) return "—";
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 10) return "just now";
  if (s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  if (m < 60) return m + "m ago";
  return Math.round(m / 60) + "h ago";
}

function fmtTime(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function fanText(r) {
  if (!r.fans || !r.fans.length) return "—";
  return r.fans.map(f => f.rpm.toLocaleString()).join(" · ");
}

function sparkline(svg, values, color) {
  const w = 300, h = 42, pad = 3;
  if (!values || values.length < 2) { svg.innerHTML = ""; return; }
  let min = Math.min(...values), max = Math.max(...values);
  if (max - min < 1.5) { min -= 0.75; max += 0.75; }
  const span = max - min || 1;
  const step = (w - pad * 2) / (values.length - 1);
  const pts = values.map((v, i) => [pad + i * step, h - pad - ((v - min) / span) * (h - pad * 2)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${w - pad} ${h} L${pad} ${h} Z`;
  svg.innerHTML =
    `<path d="${area}" fill="${color}" opacity="0.10"></path>` +
    `<path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>` +
    `<circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="2.4" fill="${color}"></circle>`;
}

function zoneRows(r) {
  const zones = [...(r.zones || [])].sort((a, b) => b.temp_c - a.temp_c).slice(0, 3);
  if (!zones.length) return "";
  return `<div class="zones">${zones.map(z =>
    `<div class="zone"><span>${esc(z.name)}</span><span>${fmtTemp(z.temp_c)} °C</span></div>`).join("")}</div>`;
}

function card(r, history) {
  const stale = Date.now() - r.ts_ms > STALE_MS;
  const meta = [];
  const add = (html) => meta.push(`<span>${html}</span>`);
  if (r.gpu_c != null) add(`GPU <b>${fmtTemp(r.gpu_c)} °C</b>`);
  if (r.load1 != null) add(`<span title="1m ${fmtLoad(r.load1)} · 5m ${fmtLoad(r.load5)} · 15m ${fmtLoad(r.load15)}">Load <b>${fmtLoad(r.load1)}</b></span>`);
  if (r.mem_used_pct != null) add(`<span title="${r.mem_total_gb ?? "?"} GB total">Mem <b>${fmtPct(r.mem_used_pct)}</b></span>`);
  if (r.disk_used_pct != null) add(`<span title="${r.disk_total_gb ?? "?"} GB total">Disk <b>${fmtPct(r.disk_used_pct)}</b></span>`);
  if (r.uptime_s != null) add(`Up <b>${fmtUptime(r.uptime_s)}</b>`);
  if (r.fans && r.fans.length) add(`Fans <b>${fanText(r)} rpm</b>`);
  if (r.cores && r.freq_mhz) add(`<b>${r.cores}</b> cores @ ${(r.freq_mhz / 1000).toFixed(1)} GHz`);
  else if (r.cores) add(`<b>${r.cores}</b> cores`);
  if (r.cpu_used_pct != null) add(`CPU <b>${fmtPct(r.cpu_used_pct)}</b>`);

  const temps = (history || []).map(h => h.cpu_c).filter(v => v != null);

  return `<article class="card${stale ? " stale" : ""}">
    <div class="card-head">
      <span class="card-title" title="${esc(r.host)}">${esc(r.host)}</span>
      <span class="card-tag">${stale ? "stale" : esc(r.source)}</span>
    </div>
    <div class="temp"><span class="value ${heatClass(r.cpu_c)}">${fmtTemp(r.cpu_c)}</span><span class="unit">°C</span></div>
    <div class="meta">${meta.join("") || "<span>No stats yet</span>"}</div>
    <svg class="spark" data-host="${esc(r.host)}" viewBox="0 0 300 42" preserveAspectRatio="none" aria-hidden="true"></svg>
    ${zoneRows(r)}
  </article>`;
}

function render(s) {
  latest = s;
  const nodes = s.nodes || [];
  const now = Date.now();
  const online = nodes.filter(n => now - n.ts_ms <= STALE_MS);
  const hottest = [...online].sort((a, b) => (b.cpu_c ?? -1) - (a.cpu_c ?? -1))[0];
  const withTemp = online.filter(n => n.cpu_c != null);
  const avg = withTemp.length ? withTemp.reduce((a, n) => a + n.cpu_c, 0) / withTemp.length : null;

  $("summary").innerHTML = nodes.length ? [
    `<span class="stat"><b>${online.length}/${nodes.length}</b> machines online</span>`,
    hottest ? `<span class="stat">Hottest <b>${fmtTemp(hottest.cpu_c)} °C</b> ${esc(hottest.host)}</span>` : "",
    avg != null ? `<span class="stat">Avg CPU <b>${fmtTemp(avg)} °C</b></span>` : "",
  ].join("") : "";

  const pill = $("statusPill");
  pill.classList.remove("live", "stale");
  if (!nodes.length) {
    $("statusText").textContent = "waiting for readings";
  } else if (online.length === nodes.length) {
    pill.classList.add("live");
    $("statusText").textContent = "live · " + ago(Math.max(...nodes.map(n => n.ts_ms)));
  } else {
    pill.classList.add("stale");
    $("statusText").textContent = (nodes.length - online.length) + " stale · " + ago(Math.max(...nodes.map(n => n.ts_ms)));
  }

  $("cards").innerHTML = nodes.length
    ? nodes.map(n => card(n, s.history?.[n.host])).join("")
    : `<p class="empty">Waiting for the first readings…</p>`;
  for (const svg of document.querySelectorAll(".spark")) {
    const host = svg.dataset.host;
    sparkline(svg, (s.history?.[host] || []).map(h => h.cpu_c).filter(v => v != null), "var(--accent)");
  }

  $("rowCount").textContent = nodes.length + (nodes.length === 1 ? " machine" : " machines");
  $("rows").innerHTML = nodes.map(n => `<tr>
    <td class="node">${esc(n.host)}</td>
    <td class="num">${fmtTime(n.ts_ms)}</td>
    <td class="num ${heatClass(n.cpu_c)}">${fmtTemp(n.cpu_c)} °C</td>
    <td class="num">${n.gpu_c == null ? "—" : fmtTemp(n.gpu_c) + " °C"}</td>
    <td class="num">${fmtLoad(n.load1)}</td>
    <td class="num" title="${n.mem_total_gb ?? "?"} GB total">${fmtPct(n.mem_used_pct)}</td>
    <td class="num" title="${n.disk_total_gb ?? "?"} GB total">${fmtPct(n.disk_used_pct)}</td>
    <td class="num">${fmtUptime(n.uptime_s)}</td>
    <td class="num">${fanText(n)}</td>
  </tr>`).join("");
}

async function tick() {
  try {
    const res = await fetch("/api/temps", { cache: "no-store" });
    render(await res.json());
  } catch {
    const pill = $("statusPill");
    pill.classList.remove("live");
    pill.classList.add("stale");
    $("statusText").textContent = "server unreachable";
  }
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1500);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied " + text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    try { document.execCommand("copy"); toast("Copied " + text); } catch {}
    ta.remove();
  }
}

$("endpoint").addEventListener("click", () => {
  if (window.getSelection().toString()) return;
  copyText($("endpoint").textContent.trim());
});

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
